<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>百科 · Gathering Waves Projects</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    />
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
    <nav class="gw-nav" aria-label="主导航">
        <a class="gw-nav__link" href="index.html">
            <i class="bi bi-house-door"></i>
            <span>主页</span>
        </a>
        <a class="gw-nav__link is-active" href="wiki.html" aria-current="page">
            <i class="bi bi-book"></i>
            <span>百科</span>
        </a>
        <a class="gw-nav__link" href="database.html">
            <i class="bi bi-database"></i>
            <span>数据库</span>
        </a>
        <a class="gw-nav__link" href="log.html">
            <i class="bi bi-journal-text"></i>
            <span>日志</span>
        </a>
    </nav>

    <main class="gw-page gw-page--wiki">
        <!-- 0. 搜索栏：所有词条之上，输入关键词按回车进行搜索；清空后恢复 -->
        <form class="gw-search" id="searchForm" role="search" aria-label="词条搜索">
            <span class="gw-search__icon" aria-hidden="true">
                <i class="bi bi-search"></i>
            </span>
            <input
                type="search"
                class="gw-search__input"
                id="searchInput"
                placeholder="搜索词条标题或内容…  按回车"
                aria-label="搜索词条"
                autocomplete="off"
                spellcheck="false"
            />
            <button
                type="button"
                class="gw-search__clear"
                id="searchClear"
                aria-label="清空搜索"
                hidden
            >
                <i class="bi bi-x-circle-fill"></i>
            </button>
        </form>

        <!-- 1. 标题栏：顶部全宽，内容由 JS 从 categories.json + 词条总数填充 -->
        <header class="gw-titlebar" aria-label="当前栏目标题">
            <span class="gw-titlebar__icon" id="titlebarIcon" aria-hidden="true">
                <i class="bi bi-book"></i>
            </span>
            <div class="gw-titlebar__text">
                <span class="gw-titlebar__crumb">百科</span>
                <h1 class="gw-titlebar__title" id="titlebarTitle">加载中…</h1>
            </div>
            <div class="gw-titlebar__meta">
                <span class="gw-titlebar__count" id="titlebarCount">-- 条词条</span>
            </div>
        </header>

        <!-- 2 + 3. 下方两栏：栏目列表 + 内容列表 -->
        <div class="gw-wiki">
            <!-- 2. 左侧：百科栏目列表，由 JS 渲染 -->
            <aside class="gw-sidebar" aria-label="百科栏目">
                <div class="gw-sidebar__head">
                    <span class="gw-sidebar__label">CATEGORIES</span>
                    <h2 class="gw-sidebar__title">百科栏目</h2>
                </div>
                <ul class="gw-categories" id="categoryList" role="tablist" aria-busy="true">
                    <li class="gw-categories__skeleton" aria-hidden="true"></li>
                    <li class="gw-categories__skeleton" aria-hidden="true"></li>
                    <li class="gw-categories__skeleton" aria-hidden="true"></li>
                </ul>
            </aside>

            <!-- 3. 右侧：内容列表，由 JS 渲染 -->
            <section class="gw-content" aria-label="词条列表">
                <div class="gw-content__head">
                    <h2 class="gw-content__title">词条列表</h2>
                    <div class="gw-content__filter" aria-hidden="true">
                        <span class="gw-content__filter-label">排序</span>
                        <span class="gw-content__filter-pill">最新</span>
                    </div>
                </div>
                <div class="gw-entries" id="entryList" aria-busy="true">
                    <div class="gw-entry__skeleton" aria-hidden="true"></div>
                    <div class="gw-entry__skeleton" aria-hidden="true"></div>
                    <div class="gw-entry__skeleton" aria-hidden="true"></div>
                </div>
            </section>
        </div>

        <p class="gw-footer">© Gathering Waves · Built with Bootstrap 5</p>
    </main>

    <!-- 图片灯箱：点击词条图片放大，点击任意位置关闭 -->
    <div class="gw-lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="图片预览">
        <div class="gw-lightbox__frame">
            <img class="gw-lightbox__img" id="lightboxImg" src="" alt="" />
        </div>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"
    ></script>
    <script>
        (function () {
            "use strict";

            // 基础路径：所有 JSON 文件都放在 data/wiki/ 下
            var DATA_BASE = "data/wiki/";

            var $titleEl   = document.getElementById("titlebarTitle");
            var $countEl   = document.getElementById("titlebarCount");
            var $iconEl    = document.getElementById("titlebarIcon");
            var $listEl    = document.getElementById("categoryList");
            var $entriesEl = document.getElementById("entryList");
            var $titlebar  = $titleEl ? $titleEl.closest(".gw-titlebar") : null;
            var $searchForm  = document.getElementById("searchForm");
            var $searchInput = document.getElementById("searchInput");
            var $searchClear = document.getElementById("searchClear");

            // 当前激活的栏目 id
            var activeId = null;
            // 缓存：catId -> 词条数组（避免重复请求）
            var cache = {};
            // 最近一次从网络加载到的 categories 列表，写回 sessionStorage 时用
            var lastCategories = null;
            // 搜索状态
            var isSearching = false;
            var searchQuery = "";
            // 搜索结果：catId -> 命中词条数组（空对象表示无任何命中）
            var searchMatches = {};
            // 进入搜索前记住的栏目，clearSearch 时回到这里
            var preSearchActiveId = null;

            // sessionStorage 缓存配置。数据很小（4 个 JSON 不到 4KB），
            // 5 分钟内认为缓存是新鲜的：够用，又不会让本地编辑后一直看不到更新。
            var STORAGE_KEY = "gw:wiki:cache:v1";
            var STORAGE_TTL = 5 * 60 * 1000;

            // ---- 工具 ----
            function escapeHtml(str) {
                return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
                    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
                });
            }

            function getJSON(url) {
                return fetch(url, { cache: "no-cache" }).then(function (resp) {
                    if (!resp.ok) {
                        throw new Error("HTTP " + resp.status + " · " + url);
                    }
                    return resp.json();
                });
            }

            function renderError(target, message, hint) {
                target.setAttribute("aria-busy", "false");
                target.innerHTML =
                    '<div class="gw-state gw-state--error">' +
                    '<i class="bi bi-exclamation-triangle"></i>' +
                    '<p class="gw-state__msg">' + escapeHtml(message) + '</p>' +
                    (hint ? '<p class="gw-state__hint">' + escapeHtml(hint) + '</p>' : "") +
                    "</div>";
            }

            // ---- 渲染：标题栏 ----
            function renderTitlebar(cat, count) {
                $titleEl.textContent = cat.title;
                $iconEl.innerHTML = '<i class="bi ' + escapeHtml(cat.icon || "bi-book") + '"></i>';
                $countEl.textContent = count + " 条词条";
            }

            // ---- 渲染：侧边栏 ----
            // activeOverride:
            //   省略 → 用全局 activeId（默认行为）
            //   null  → 不点亮任何栏目（搜索未锁定到具体栏目时用）
            //   具体 id → 强制点亮该栏目
            function renderSidebar(categories, counts, activeOverride) {
                $listEl.setAttribute("aria-busy", "false");
                var effectiveActive = (activeOverride === undefined) ? activeId : activeOverride;
                $listEl.innerHTML = categories
                    .map(function (cat) {
                        var isActive = cat.id === effectiveActive;
                        return (
                            '<li class="gw-categories__item' + (isActive ? " is-active" : "") + '"' +
                            ' data-category="' + escapeHtml(cat.id) + '"' +
                            ' role="tab" aria-selected="' + (isActive ? "true" : "false") + '"' +
                            ' tabindex="0">' +
                            '<span class="gw-categories__icon"><i class="bi ' +
                            escapeHtml(cat.icon || "bi-book") + '"></i></span>' +
                            '<span class="gw-categories__name">' + escapeHtml(cat.title) + '</span>' +
                            '<span class="gw-categories__count">' +
                            (counts[cat.id] != null ? counts[cat.id] : "…") +
                            "</span>" +
                            "</li>"
                        );
                    })
                    .join("");
            }

            // ---- 渲染：单条词条卡片（搜索结果与栏目列表都复用） ----
            function entryCardHTML(entry) {
                var titleHtml = '<h3 class="gw-entry__title">' + escapeHtml(entry.title || "") + "</h3>";

                // 图片：非空字符串才渲染（null / 空 / 缺字段都不显示）
                var imageHtml = "";
                if (typeof entry.image === "string" && entry.image.trim()) {
                    imageHtml =
                        '<div class="gw-entry__image">' +
                        '<img src="' + escapeHtml(entry.image) + '" alt="' + escapeHtml(entry.title || "") + '" loading="lazy" />' +
                        "</div>";
                }

                // content 允许多行：先 escapeHtml，再把 \n 还原成 <br> 即可
                var contentHtml =
                    '<div class="gw-entry__content">' +
                    escapeHtml(entry.content || "").replace(/\n/g, "<br>") +
                    "</div>";

                // notes：非空才渲染，整块放进带黄边浅黄底的容器
                var notesHtml = "";
                if (typeof entry.notes === "string" && entry.notes.trim()) {
                    notesHtml =
                        '<div class="gw-entry__notes">' +
                        escapeHtml(entry.notes).replace(/\n/g, "<br>") +
                        "</div>";
                }

                return (
                    '<article class="gw-entry">' +
                    '<div class="gw-entry__head">' + titleHtml + "</div>" +
                    '<div class="gw-entry__body">' +
                    contentHtml +
                    imageHtml +
                    "</div>" +
                    notesHtml +
                    "</article>"
                );
            }

            // ---- 渲染：词条列表 ----
            function renderEntries(entries) {
                $entriesEl.setAttribute("aria-busy", "false");
                if (!entries.length) {
                    $entriesEl.innerHTML =
                        '<div class="gw-state gw-state--empty">' +
                        '<i class="bi bi-inbox"></i>' +
                        '<p class="gw-state__msg">该栏目下还没有词条</p>' +
                        '<p class="gw-state__hint">编辑 data/wiki/' +
                        '<code id="emptyCatId"></code>.json，往数组里添加词条即可。</p>' +
                        "</div>";
                    var node = document.getElementById("emptyCatId");
                    if (node) node.textContent = activeId || "";
                    return;
                }
                $entriesEl.innerHTML = entries.map(entryCardHTML).join("");
            }

            // ---- 取一个栏目的词条（带缓存） ----
            function fetchEntries(catId) {
                if (cache[catId]) return Promise.resolve(cache[catId]);
                return getJSON(DATA_BASE + catId + ".json").then(function (data) {
                    var arr = Array.isArray(data) ? data : [];
                    cache[catId] = arr;
                    return arr;
                });
            }

            // ---- 搜索：判定单条词条是否命中关键词 ----
            // 在 title / content / notes 三个文本字段里做不区分大小写的子串匹配
            function entryMatchesQuery(entry, q) {
                if (!q) return true;
                if ((entry.title   || "").toLowerCase().indexOf(q) !== -1) return true;
                if ((entry.content || "").toLowerCase().indexOf(q) !== -1) return true;
                if ((entry.notes   || "").toLowerCase().indexOf(q) !== -1) return true;
                return false;
            }

            // ---- 搜索结果渲染：按栏目分组，每组下挂着命中词条 ----
            // matchesByCategory: { catId: [entry, ...] }
            // 用 entryCardHTML 复用现有卡片样式，外部包一层栏目标题
            function renderSearchResults(matchesByCategory) {
                var ids = Object.keys(matchesByCategory);
                var total = 0;
                ids.forEach(function (id) { total += (matchesByCategory[id] || []).length; });

                $entriesEl.setAttribute("aria-busy", "false");

                if (total === 0) {
                    $entriesEl.innerHTML =
                        '<div class="gw-state gw-state--no-results">' +
                        '<i class="bi bi-search"></i>' +
                        '<p class="gw-state__msg">没有找到匹配「' + escapeHtml(searchQuery) +
                        '」的词条</p>' +
                        '<p class="gw-state__hint">试试换一个关键词，或清空搜索查看全部栏目</p>' +
                        "</div>";
                    return;
                }

                // 按 lastCategories 的原始顺序输出分组，保证展示稳定
                var orderedIds = (lastCategories || [])
                    .map(function (c) { return c.id; })
                    .filter(function (id) { return matchesByCategory[id] && matchesByCategory[id].length; });

                // 容错：万一 lastCategories 还没就绪、或者有命中不在分类里，再补一轮
                ids.forEach(function (id) {
                    if (orderedIds.indexOf(id) === -1) orderedIds.push(id);
                });

                var html = orderedIds.map(function (catId) {
                    var cat = (lastCategories || []).find(function (c) { return c.id === catId; });
                    var title = cat ? cat.title : catId;
                    var icon  = cat && cat.icon ? cat.icon : "bi-book";
                    var entries = matchesByCategory[catId] || [];
                    return (
                        '<section class="gw-search-group" data-category="' + escapeHtml(catId) + '">' +
                        '<h3 class="gw-search-group__title">' +
                        '<i class="bi ' + escapeHtml(icon) + '"></i>' +
                        '<span>' + escapeHtml(title) + '</span>' +
                        '<span class="gw-search-group__count">' + entries.length + '</span>' +
                        '</h3>' +
                        entries.map(entryCardHTML).join("") +
                        '</section>'
                    );
                }).join("");

                $entriesEl.innerHTML = html;
            }

            // ---- 执行搜索 ----
            // query: 用户输入的原始字符串；空 / 空白会直接走 clearSearch
            function performSearch(query) {
                var q = (query || "").trim();
                if (!q) {
                    clearSearch();
                    return;
                }

                isSearching = true;
                searchQuery = q;
                preSearchActiveId = activeId;

                var lowerQ = q.toLowerCase();
                var matches = {};
                var total = 0;
                Object.keys(cache).forEach(function (catId) {
                    var hits = (cache[catId] || []).filter(function (entry) {
                        return entryMatchesQuery(entry, lowerQ);
                    });
                    if (hits.length) {
                        matches[catId] = hits;
                        total += hits.length;
                    }
                });
                searchMatches = matches;

                // 左侧栏目：只保留有命中的，数字也改成命中数
                var filteredCats = (lastCategories || []).filter(function (cat) {
                    return matches[cat.id] && matches[cat.id].length;
                });
                var matchCounts = {};
                Object.keys(matches).forEach(function (id) { matchCounts[id] = matches[id].length; });
                renderSidebar(filteredCats, matchCounts, null);

                // 标题栏切到搜索态
                if ($titlebar) $titlebar.classList.add("is-searching");
                $titleEl.textContent = "搜索结果";
                $iconEl.innerHTML = '<i class="bi bi-search"></i>';
                $countEl.textContent = total + " 条匹配";

                // 右侧内容：按栏目分组展示所有命中
                renderSearchResults(matches);

                // 清空按钮可见
                if ($searchClear) $searchClear.hidden = false;
            }

            // ---- 清空搜索：恢复全部栏目，回到搜索前的 activeId ----
            function clearSearch() {
                if (!isSearching) {
                    // 即使没在搜索中，也把搜索栏的可见状态归位
                    if ($searchInput) $searchInput.value = "";
                    if ($searchClear) $searchClear.hidden = true;
                    return;
                }

                isSearching = false;
                searchQuery = "";
                searchMatches = {};
                if ($searchInput) $searchInput.value = "";
                if ($searchClear) $searchClear.hidden = true;
                if ($titlebar) $titlebar.classList.remove("is-searching");

                // 恢复 activeId：优先回到搜索前记录的栏目；缺失则退回第一个
                if (preSearchActiveId && (lastCategories || []).some(function (c) { return c.id === preSearchActiveId; })) {
                    activeId = preSearchActiveId;
                } else {
                    activeId = (lastCategories && lastCategories[0]) ? lastCategories[0].id : null;
                }
                preSearchActiveId = null;

                // 重新渲染左侧完整栏目（使用各栏目真实条数）
                var counts = {};
                Object.keys(cache).forEach(function (id) { counts[id] = (cache[id] || []).length; });
                renderSidebar(lastCategories || [], counts);

                // 标题栏与右侧内容都回到 activeId 栏目
                if (activeId) {
                    var activeCat = (lastCategories || []).find(function (c) { return c.id === activeId; });
                    if (activeCat) renderTitlebar(activeCat, counts[activeId] || 0);
                    loadCategory(activeId, { skipAnimation: true });
                }
            }

            // ---- 切换栏目（带 180ms 淡入） ----
            // opts.skipAnimation = true 时直接渲染,跳过骨架屏和淡入延迟,
            // 用于从 sessionStorage 命中时秒开首屏。
            function loadCategory(catId, opts) {
                opts = opts || {};
                if (!opts.skipAnimation) {
                    $entriesEl.setAttribute("aria-busy", "true");
                    $entriesEl.classList.add("is-swapping");
                    // 骨架屏
                    $entriesEl.innerHTML =
                        '<div class="gw-entry__skeleton" aria-hidden="true"></div>' +
                        '<div class="gw-entry__skeleton" aria-hidden="true"></div>' +
                        '<div class="gw-entry__skeleton" aria-hidden="true"></div>';
                }

                fetchEntries(catId)
                    .then(function (entries) {
                        if (opts.skipAnimation) {
                            renderEntries(entries);
                            $entriesEl.classList.remove("is-swapping");
                        } else {
                            window.setTimeout(function () {
                                renderEntries(entries);
                                $entriesEl.classList.remove("is-swapping");
                            }, 180);
                        }
                    })
                    .catch(function (err) {
                        console.error("[wiki] 加载栏目失败:", err);
                        renderError(
                            $entriesEl,
                            "无法加载栏目「" + catId + "」的词条",
                            "请确认 data/wiki/" + catId + ".json 存在，并通过本地 HTTP 服务访问页面。"
                        );
                    });
            }

            // ---- sessionStorage 读写 ----
            function loadFromStorage() {
                try {
                    var raw = sessionStorage.getItem(STORAGE_KEY);
                    if (!raw) return null;
                    var obj = JSON.parse(raw);
                    if (!obj || !Array.isArray(obj.categories) || !obj.entries) return null;
                    if (typeof obj.entries !== "object") return null;
                    if (Date.now() - (obj.savedAt || 0) > STORAGE_TTL) return null;
                    return obj;
                } catch (e) {
                    return null;
                }
            }

            function saveToStorage() {
                try {
                    sessionStorage.setItem(
                        STORAGE_KEY,
                        JSON.stringify({
                            savedAt: Date.now(),
                            categories: lastCategories || [],
                            entries: cache
                        })
                    );
                } catch (e) {
                    // sessionStorage 不可用（隐私模式）或写满，静默失败
                }
            }

            // ---- 启动渲染（categories + counts 准备好后调用） ----
            // skipAnimation=true 时直接渲染首屏,用于从 sessionStorage 命中时秒开
            function bootstrap(categories, counts, skipAnimation) {
                lastCategories = categories;
                activeId = categories[0].id;
                renderSidebar(categories, counts);
                renderTitlebar(categories[0], counts[activeId] || 0);
                loadCategory(activeId, { skipAnimation: !!skipAnimation });
            }

            // ---- 首次加载 / 缓存失效：从网络拉 ----
            function fullLoad() {
                return getJSON(DATA_BASE + "categories.json")
                    .then(function (root) {
                        var categories = (root && root.categories) || [];
                        if (!categories.length) {
                            renderError(
                                $listEl,
                                "data/wiki/categories.json 中没有栏目",
                                "请在该文件中定义 categories 数组。"
                            );
                            return null;
                        }
                        // 并行拉所有栏目的词条，缓存起来的同时也算条数
                        return Promise.all(
                            categories.map(function (cat) {
                                return fetchEntries(cat.id)
                                    .then(function (entries) { return [cat.id, entries.length]; })
                                    .catch(function () { return [cat.id, 0]; });
                            })
                        ).then(function (pairs) {
                            var counts = {};
                            pairs.forEach(function (p) { counts[p[0]] = p[1]; });
                            bootstrap(categories, counts);
                            saveToStorage();
                            return categories;
                        });
                    })
                    .catch(function (err) {
                        console.error("[wiki] 加载 categories.json 失败:", err);
                        renderError(
                            $listEl,
                            "无法加载百科栏目清单",
                            "常见原因：直接以 file:// 打开页面（浏览器禁止本地 fetch）。请运行本地 HTTP 服务，例如：\n  npx serve .\n  python -m http.server 8000"
                        );
                        renderError(
                            $entriesEl,
                            "等待栏目清单…",
                            "栏目加载成功后此处会自动出现词条。"
                        );
                    });
            }

            // ---- 后台静默刷新：更新内存 + sessionStorage，不重渲染当前视图 ----
            function backgroundRefresh() {
                getJSON(DATA_BASE + "categories.json")
                    .then(function (root) {
                        var categories = (root && root.categories) || [];
                        if (categories.length) lastCategories = categories;
                        return categories;
                    })
                    .catch(function () { return lastCategories || []; })
                    .then(function (categories) {
                        if (!categories.length) return null;
                        return Promise.all(
                            categories.map(function (cat) {
                                return getJSON(DATA_BASE + cat.id + ".json")
                                    .then(function (data) {
                                        cache[cat.id] = Array.isArray(data) ? data : [];
                                    })
                                    .catch(function () { /* 保留旧缓存 */ });
                            })
                        );
                    })
                    .then(function () { saveToStorage(); })
                    .catch(function (err) {
                        console.warn("[wiki] 后台刷新失败:", err);
                    });
            }

            // ---- 启动：优先从 sessionStorage 渲染，再后台静默刷新 ----
            var stored = loadFromStorage();
            if (stored && stored.categories.length) {
                // 命中：把数据灌进内存 cache，然后立刻渲染
                Object.keys(stored.entries).forEach(function (id) {
                    cache[id] = stored.entries[id];
                });
                var counts = {};
                stored.categories.forEach(function (c) {
                    counts[c.id] = (cache[c.id] || []).length;
                });
                bootstrap(stored.categories, counts, true);
                var savedAgo = Math.max(0, Math.round((Date.now() - stored.savedAt) / 1000));
                console.info(
                    "[wiki] 从 sessionStorage 渲染，" + savedAgo + " 秒前保存。" +
                    "本地编辑 JSON 后想立刻看效果：" +
                    "sessionStorage.removeItem('" + STORAGE_KEY + "') 然后刷新。"
                );
                backgroundRefresh();
            } else {
                fullLoad();
            }

            // bfcache 兜底：用浏览器后退/前进键切回时，JS 状态和 DOM 都还在，
            // 不需要做任何事。这里只打个日志方便观察。
            window.addEventListener("pageshow", function (e) {
                if (e.persisted) {
                    console.info("[wiki] 来自 bfcache，无需重新加载数据");
                }
            });

            // ---- 交互：切换栏目 ----
            $listEl.addEventListener("click", function (e) {
                var item = e.target.closest(".gw-categories__item");
                if (!item) return;
                var clickedId = item.dataset.category;

                // 搜索模式下：点击栏目 = 在搜索结果中锁定到该栏目
                if (isSearching) {
                    var hits = searchMatches[clickedId];
                    if (!hits || !hits.length) return;
                    if (item.classList.contains("is-active")) return;

                    $listEl.querySelectorAll(".gw-categories__item").forEach(function (el) {
                        var on = el === item;
                        el.classList.toggle("is-active", on);
                        el.setAttribute("aria-selected", on ? "true" : "false");
                    });

                    activeId = clickedId;
                    // 标题栏在搜索态下也展示该栏目 + 命中数
                    var cat = (lastCategories || []).find(function (c) { return c.id === clickedId; });
                    if (cat) {
                        $titleEl.textContent = "搜索 · " + cat.title;
                        $iconEl.innerHTML = '<i class="bi ' + escapeHtml(cat.icon || "bi-book") + '"></i>';
                    } else {
                        $titleEl.textContent = "搜索结果";
                        $iconEl.innerHTML = '<i class="bi bi-search"></i>';
                    }
                    $countEl.textContent = hits.length + " 条匹配";

                    var single = {};
                    single[clickedId] = hits;
                    renderSearchResults(single);
                    return;
                }

                // 正常模式下：切换栏目
                if (item.classList.contains("is-active")) return;
                activeId = clickedId;

                $listEl.querySelectorAll(".gw-categories__item").forEach(function (el) {
                    var on = el === item;
                    el.classList.toggle("is-active", on);
                    el.setAttribute("aria-selected", on ? "true" : "false");
                });

                // 标题栏从已渲染的 DOM 中读
                var name = item.querySelector(".gw-categories__name").textContent;
                var iconClass = item.querySelector(".gw-categories__icon i").className;
                var icon = iconClass.split(" ").filter(function (c) { return c.indexOf("bi-") === 0; })[0] || "bi-book";
                var count = item.querySelector(".gw-categories__count").textContent;
                $titleEl.textContent = name;
                $iconEl.innerHTML = '<i class="bi ' + escapeHtml(icon) + '"></i>';
                $countEl.textContent = count + " 条词条";

                loadCategory(activeId);
            });

            $listEl.addEventListener("keydown", function (e) {
                if (e.key !== "Enter" && e.key !== " ") return;
                var item = e.target.closest(".gw-categories__item");
                if (item) {
                    e.preventDefault();
                    item.click();
                }
            });

            // ---- 交互：搜索栏 ----
            // 仅在数据加载完（lastCategories 就绪）后才允许提交，避免空 cache 时搜出空结果
            if ($searchForm) {
                $searchForm.addEventListener("submit", function (e) {
                    e.preventDefault();
                    if (!lastCategories) return;
                    performSearch($searchInput ? $searchInput.value : "");
                });

                // 输入框内容变化时，控制 X 按钮的可见性
                if ($searchInput) {
                    $searchInput.addEventListener("input", function () {
                        if (!$searchClear) return;
                        $searchClear.hidden = !$searchInput.value;
                    });

                    // Esc 直接清空并退出搜索
                    $searchInput.addEventListener("keydown", function (e) {
                        if (e.key === "Escape") {
                            e.preventDefault();
                            clearSearch();
                        }
                    });
                }

                if ($searchClear) {
                    $searchClear.addEventListener("click", function () {
                        clearSearch();
                        if ($searchInput) $searchInput.focus();
                    });
                }
            }

            // ---- 图片灯箱 ----
            // 点击词条缩略图打开；打开状态下点击灯箱任意位置（含图片）即关闭。
            (function setupLightbox() {
                var $lightbox = document.getElementById("lightbox");
                var $lightboxImg = document.getElementById("lightboxImg");
                if (!$lightbox || !$lightboxImg) return;

                function openLightbox(src, alt) {
                    $lightboxImg.src = src;
                    $lightboxImg.alt = alt || "";
                    $lightbox.classList.add("is-open");
                    $lightbox.setAttribute("aria-hidden", "false");
                    // 锁滚动，避免背景被一起滚
                    document.body.style.overflow = "hidden";
                }

                function closeLightbox() {
                    if (!$lightbox.classList.contains("is-open")) return;
                    $lightbox.classList.remove("is-open");
                    $lightbox.setAttribute("aria-hidden", "true");
                    // 清掉 src，大图关闭后不再常驻内存
                    $lightboxImg.removeAttribute("src");
                    $lightboxImg.alt = "";
                    document.body.style.overflow = "";
                }

                // 事件委托：点击词条图片时打开
                $entriesEl.addEventListener("click", function (e) {
                    var imgWrap = e.target.closest(".gw-entry__image");
                    if (!imgWrap) return;
                    var img = imgWrap.querySelector("img");
                    if (!img || !img.src) return;
                    openLightbox(img.src, img.alt);
                });

                // 灯箱内任意位置点击都关闭（backdrop / 白色 frame / 图片本身）
                $lightbox.addEventListener("click", closeLightbox);
            })();
        })();
    </script>
</body>
</html>
